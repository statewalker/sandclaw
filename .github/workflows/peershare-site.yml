name: PeerShare site

# Publishes the PeerShare page to https://peershare.httpeers.net (decision 2.8) with
# statewalker/.github's publish-site.yml: the files go to httpeers' `sites` bucket under that
# name, and the sites host serves them at once. `build:site` writes the page, `peershare.json`
# (the relay's addresses, read from its own document, and the session zone *.p.httpeers.net) and
# `.site/config.json` (`spa: true`, so /peer-share/invite is the page too).
#
# Needs the SITES_S3_ACCESS_KEY_ID and SITES_S3_SECRET_ACCESS_KEY secrets (organization or
# repository) with write access to the bucket.

on:
  push:
    branches: [main]
    paths:
      - "apps/peershare.app/**"
      - "apps/peershare.share/**"
      - "apps/peershare.share-react/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/peershare-site.yml"
  workflow_dispatch:

jobs:
  # Only a commit that passes the shared CI is published.
  ci:
    uses: statewalker/.github/.github/workflows/ci.yml@main

  site:
    needs: ci
    uses: statewalker/.github/.github/workflows/publish-site.yml@main
    with:
      domain: peershare.httpeers.net
      build: |
        pnpm --filter "@statewalker/peershare.app^..." run --if-present build
        pnpm --filter @statewalker/peershare.app build:site
      path: apps/peershare.app/site/peershare.httpeers.net
    secrets: inherit
