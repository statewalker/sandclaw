name: PeerShare help site

# Publishes PeerShare's help site (apps/peershare.help, Astro) to
# https://peershare-demo.httpeers.net. It is also the example service to try PeerShare with: a
# remote https:// site with a domain name, so PeerShare shares it directly; its
# `.site/config.json` (from public/) lists PeerShare's origin under `cors`, so the page may
# read it (httpeers' sites host answers the CORS headers and the preflight).
#
# Needs the HTTPEERS_S3_ACCESS_KEY_ID and HTTPEERS_S3_SECRET_ACCESS_KEY secrets (the ones the
# PeerShare site uses) to be allowed to write the peershare-demo.httpeers.net prefix too:
# statewalker/cellb.dev's site/scripts/setup-publish-secrets.sh with
# REPO=statewalker/sandclaw SITE_USER=peershare-site SITE_DOMAIN=peershare.httpeers.net
# SITE_DOMAINS="peershare.httpeers.net s.httpeers.net peershare-demo.httpeers.net".

on:
  push:
    branches: [main]
    paths:
      - "apps/peershare.help/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/peershare-demo-site.yml"
  workflow_dispatch:

jobs:
  site:
    uses: statewalker/.github/.github/workflows/publish-site.yml@main
    with:
      domain: peershare-demo.httpeers.net
      build: pnpm --filter @statewalker/peershare.help build
      path: apps/peershare.help/dist
    secrets:
      SITES_S3_ACCESS_KEY_ID: ${{ secrets.HTTPEERS_S3_ACCESS_KEY_ID }}
      SITES_S3_SECRET_ACCESS_KEY: ${{ secrets.HTTPEERS_S3_SECRET_ACCESS_KEY }}
